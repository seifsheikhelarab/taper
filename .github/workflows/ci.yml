name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests
        run: go test ./pkg/...

      # Integration dependencies: Postgres (with Debezium's logical decoding
      # plugin), Kafka (KRaft), and Debezium Connect - the same stack as
      # docker-compose.yml, so CI runs the exact local setup.
      - name: Start data stores
        run: docker compose up -d --wait postgres kafka

      # Migrations MUST precede connector registration: the connectors
      # snapshot public.outbox as taper_cdc at startup, and both the SELECT
      # grants and the outbox RLS scoping (to taper_app only) ship in the
      # migrations. Registered before they exist, the snapshot fails with
      # "permission denied" and retries forever - the task reports RUNNING
      # while streaming nothing.
      # postgres's init dance (temp server during initdb, then a restart)
      # can slip past --wait; gate migrations on pg_isready instead.
      - name: Apply migrations
        run: |
          until docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 2; done
          docker compose exec -T postgres psql -U postgres -d taper_db < db/migrations/stock/000001_init_stock.up.sql
          docker compose exec -T postgres psql -U postgres -d taper_db < db/migrations/stock/000002_grant_sweeper.up.sql
          docker compose exec -T postgres psql -U postgres -d reservation_db < db/migrations/reservation/000001_init_reservation.up.sql
          docker compose exec -T postgres psql -U postgres -d order_db < db/migrations/order/000001_init_order.up.sql
          docker compose exec -T postgres psql -U postgres -d channelsync_db < db/migrations/channelsync/000001_init_channelsync.up.sql

      - name: Start Debezium Connect
        run: docker compose up -d --wait connect

      # connect-init is a sibling service (not a dependency of connect), so
      # --wait does not start it; run it explicitly to register connectors.
      # Registration POSTs return only after the herder round-trips, which
      # can take a minute per connector on a cold Connect instance.
      - name: Register connectors
        run: docker compose run --rm connect-init

      - name: Wait for connector tasks
        run: |
          for i in $(seq 1 45); do
            ok=1
            for c in stock-outbox reservation-outbox order-outbox; do
              state=$(curl -sf http://localhost:8083/connectors/$c/status | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['connector']['state'], d['tasks'][0]['state'] if d['tasks'] else 'NOTASK')" 2>/dev/null || echo missing)
              echo "$c: $state"
              case "$state" in *RUNNING*) ;; *) ok=0 ;; esac
            done
            [ "$ok" = "1" ] && exit 0
            sleep 2
          done
          echo "connectors did not reach RUNNING in time"
          docker logs taper-connect --tail 50
          exit 1

      - name: Integration tests
        env:
          KAFKA_BROKERS: localhost:29092
        run: go test -v ./integration/

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 50 postgres kafka connect || true
