services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: taper-jaeger
    # OTLP ingestion for the taper services' traces (UI on 16686).
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  postgres:
    # Debezium-postgres build: includes decoderbufs/wal2json logical decoding plugins.
    image: quay.io/debezium/postgres:16-alpine
    container_name: taper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taper_db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4", "-c", "output_plugin_libraries=pgoutput,decoderbufs"]
    ports:
      - "5432:5432"
      # Second host port for subprocess tests (trace test, chaos suite) so a
      # locally installed Postgres on 5432 cannot shadow the container's DBs.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taper_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:3.9.0
    container_name: taper-kafka
    environment:
      # KRaft mode: no ZooKeeper (single-node combined broker+controller).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # INTERNAL for containers, EXTERNAL for host-side tests/clients.
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      # Single-node cluster: internal topics must have RF=1 or they can never be created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "taper-kafka-cluster-001"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Pre-creates Connect's internal topics with cleanup.policy=compact.
  # If they are auto-created with 'delete', Connect refuses to start
  # (it requires compacted offset/config/status topics).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: taper-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        create_compacted() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config cleanup.policy=compact >/dev/null
          echo "compacted topic ready: $$1 (partitions=$$2)"
        }
        create_compacted connect_configs 1
        create_compacted connect_offsets 1
        create_compacted connect_statuses 1
        create_topics() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
            --topic "$$1" --partitions 6 --replication-factor 1 >/dev/null
          echo "event topic ready: $$1"
        }
        create_topics stock.events
        create_topics stock.events.dlq
        create_topics reservation.events
        create_topics reservation.events.dlq
        create_topics order.events
        create_topics order.events.dlq

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: taper-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      # Connect runs inside the network and talks to the INTERNAL listener.
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18

  # Registers the two outbox event router connectors once Connect is up.
  connect-init:
    image: curlimages/curl:8.8.0
    container_name: taper-connect-init
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./db/connect:/connect-configs:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in /connect-configs/*.json; do
          name=$$(basename "$$f" .json)
          echo "registering connector $$name"
          curl -sf -X POST -H "Content-Type: application/json" \
            --data @"$$f" http://connect:8083/connectors || \
          echo "connector $$name may already exist"
        done
        echo "connector registration complete"

volumes:
  postgres_data:
