# The five Go binaries mirroring the compose containers profile. Common
# traits: probes on the admin listener (/healthz liveness, /readyz
# readiness), env from taper-config + taper-secrets, TAPER_DRAIN drain
# window, distroless images built from the repo Dockerfile (BIN build-arg).
# NOTE on GATEWAY_JWT_SECRET: the gateway exits at boot when it is blank
# (spec #52 fail-fast); set a real value in taper-secrets before deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: taper
spec:
  replicas: 2
  selector:
    matchLabels: { app: stock }
  template:
    metadata:
      labels: { app: stock }
    spec:
      containers:
        - name: stock
          image: ghcr.io/seifsheikhelarab/taper-stock:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9100
              name: admin
          envFrom:
            - configMapRef: { name: taper-config }
            - secretRef: { name: taper-secrets }
          env:
            - name: STOCK_ADDR
              value: ":50051"
            - name: STOCK_DATABASE_URL
              value: "postgres://taper_app:taperapp@postgres:5432/taper_db"
            - name: STOCK_SWEEPER_DATABASE_URL
              value: "postgres://taper_sweeper:tapersweeper@postgres:5432/taper_db"
            - name: METRICS_ADDR
              value: ":9100"
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: taper
  # Metadata labels drive the ServiceMonitor selector (spec.selector below
  # only routes traffic) — without them nothing is scraped.
  labels: { app: stock }
spec:
  selector: { app: stock }
  ports:
    - port: 50051
      targetPort: grpc
    - name: admin
      port: 9100
      targetPort: admin
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stock
  namespace: taper
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: stock }
---
