# Admin-only Service: the ServiceMonitor scrapes Services, and fulfillment
# publishes no gRPC port — without this its RED metrics are never collected.
apiVersion: v1
kind: Service
metadata:
  name: fulfillment
  namespace: taper
  labels: { app: fulfillment }
spec:
  selector: { app: fulfillment }
  ports:
    - name: admin
      port: 9100
      targetPort: admin
